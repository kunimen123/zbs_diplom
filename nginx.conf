server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Правильные MIME типы для Flutter
    location ~* \.js$ {
        add_header Content-Type application/javascript;
    }
    
    location ~* \.json$ {
        add_header Content-Type application/json;
    }
}